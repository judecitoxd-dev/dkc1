name: Windows first-level preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC Release build
        run: cmake -S . -B build -A x64

      - name: Build native preview and direct level test
        run: >-
          cmake --build build --config Release
          --target dk1_win32 dk1_level_test_win32 --parallel

      - name: Package preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/dk1_win32.exe package/DK1-Jungle-Hijinxs-Preview.exe
          Copy-Item build/Release/dk1_level_test_win32.exe package/DK1-Jungle-Hijinxs-Direct-Test.exe
          @'
          DK1 Jungle Hijinxs provisional Windows test package

          FASTEST TEST:
          1. Run DK1-Jungle-Hijinxs-Direct-Test.exe.
          2. Select your own unheadered Donkey Kong Country (USA) Rev 2 .sfc ROM.
          3. The program preloads the level textures and opens Jungle Hijinxs
             immediately, skipping the provisional intro/menu/map.
          4. The window title reports stable route progress and four route
             checkpoints. Walking backwards does not lower the percentage.
          5. Falling far below the viewport automatically restarts the level.
          6. Reaching 100 percent freezes the completed run and writes
             DK1-Jungle-Hijinxs-Test-Report.txt beside the program.

          FULL PREVIEW FLOW:
          Run DK1-Jungle-Hijinxs-Preview.exe for:
          intro -> title -> game menu -> Kongo Jungle map -> Jungle Hijinxs
          -> provisional completion -> return to map.

          Controls:
          - Left/Right or A/D: move
          - Z: jump
          - U: pick up / throw barrel
          - F2: test-only rescue warp forward by 10 percent, up to 95 percent
          - R: restart the direct test from the beginning
          - Enter: restart after completing the direct test
          - Esc: exit

          F2 exists only so an incomplete collision or object callback cannot
          prevent testing the later parts of the current route. The generated
          report records how many rescue warps and restarts were used.

          No ROM or copyrighted extracted assets are included. Both programs
          read graphics and palettes from the user's legal ROM/cache.
          This is a first-level vertical slice, not a complete game build.
          '@ | Set-Content -Encoding UTF8 package/README.txt
          Compress-Archive -Path package/* -DestinationPath DK1-Jungle-Hijinxs-Preview-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DK1-Jungle-Hijinxs-Preview-Windows-x64
          path: DK1-Jungle-Hijinxs-Preview-Windows-x64.zip
          if-no-files-found: error

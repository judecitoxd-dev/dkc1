name: Windows first-level preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package native Windows testers
        shell: pwsh
        run: >-
          ./tools/build_windows_preview.ps1
          -Configuration Release
          -Architecture x64
          -BuildDirectory build-windows
          -OutputZip DK1-Jungle-Hijinxs-Preview-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DK1-Jungle-Hijinxs-Preview-Windows-x64
          path: DK1-Jungle-Hijinxs-Preview-Windows-x64.zip
          if-no-files-found: error

name: Build YI Android APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        run: |
          cat yi_chunk_00 yi_chunk_01 yi_chunk_02 yi_chunk_03 yi_chunk_04 yi_chunk_05 yi_chunk_06 yi_chunk_07 yi_chunk_08 yi_chunk_09 > yi_android_project.zip.b64
          base64 -d yi_android_project.zip.b64 > yi_android_project.zip
          echo "6320e7c3251358a720d0a0ebaac01d1d8d107f3151f2f1683dbbe2a25db3788d  yi_android_project.zip" | sha256sum -c -
          unzip -q yi_android_project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: YI_Android_v0.5
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp YI_Android_v0.5/app/build/outputs/apk/debug/app-debug.apk YI_Native_Android_v0.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YI-Native-Android-v0.5
          path: YI_Native_Android_v0.5.apk
          if-no-files-found: error

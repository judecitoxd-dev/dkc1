name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test ROM-independent suite
        run: >-
          ctest --test-dir build --output-on-failure
          -E '^(player_terrain_runtime|player_live_runtime|software_frontend_terrain|spc700_ipl_driver_bridge|player_visual_runtime|gnawty_runtime|barrel_scene_runtime|software_frontend_barrel|level_sprite_records|level_sprite_catalog|level_object_spawn|level_software_frontend|level_dynamic_bg1|preview_asset_warmup|object_actor_runtime|object_screen_oam|object_frame_dma|spc700_driver_startup|object_frame_layout|apu_driver_catalog|scene_asset_loading)$'
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
